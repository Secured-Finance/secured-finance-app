name: Merge into main

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit ID'
        required: false
        type: string

jobs:
  deploy:
    name: Merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.MACHINE_USER_APP_ID }}
          private-key: ${{ secrets.MACHINE_USER_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.generate_token.outputs.token }}
      - name: Merge into main and tag the version
        shell: bash
        env:
          APP_ID: ${{ secrets.MACHINE_USER_APP_ID }}
          MERGE_COMMIT: ${{ github.event.inputs.commit || 'develop' }}
        run: |
          git config user.name "SF Machine User[bot]"
          git config user.email "${APP_ID}+sf-machine-user[bot]@users.noreply.github.com"
          git switch main
          git merge "$MERGE_COMMIT"
          git push
