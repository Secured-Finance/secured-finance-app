name: Merge into main

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit ID'
        required: false
        type: string

jobs:
  deploy:
    name: Merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.MACHINE_USER_APP_ID }}
          private-key: ${{ secrets.MACHINE_USER_PRIVATE_KEY }}
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ steps.generate_token.outputs.token }}
      - name: Merge into main and tag the version
        shell: bash
        env:
          APP_ID: ${{ secrets.MACHINE_USER_APP_ID }}
          MERGE_COMMIT: ${{ github.event.inputs.commit || 'develop' }}
        run: |
          git config user.name "SF Machine User[bot]"
          git config user.email "${APP_ID}+sf-machine-user[bot]@users.noreply.github.com"
          git switch main
          git merge "$MERGE_COMMIT"
          git push
