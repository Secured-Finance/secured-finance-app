name: Cypress Run Tests
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    secrets:
      TENDERLY_KEY:
        required: true
      PAT:
        required: true

jobs:
  cypress-run:
    name: Cypress Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download the build folders of the WebApp
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: build

      - name: Install Dependencies for serving the Web App to Cypress
        run: npm install serve
        env:
          NPM_AUTH_TOKEN: ${{ secrets.PAT }}

      - name: Cypress run
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        with:
          install: false
          start: npx serve ./build -l 3000
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180
          record: false
          component: false
        env:
          CYPRESS_TENDERLY_KEY: ${{ secrets.TENDERLY_KEY }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 3
