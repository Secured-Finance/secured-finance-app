name: Cypress Run Tests
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
    secrets:
      TENDERLY_KEY:
        required: true

jobs:
  cypress-run:
    name: Cypress Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download the build folders of the WebApp
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: build

      - name: Install Dependencies
        run: npm ci --ignore-scripts
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Install Cypress Binary
        run: npm rebuild cypress

      - name: Cypress run
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          install: false
          start: npx serve ./build -l 3000
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 180
          record: false
          component: false
        env:
          CYPRESS_TENDERLY_KEY: ${{ secrets.TENDERLY_KEY }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 3
