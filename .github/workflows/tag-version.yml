name: Create a Version and Tag It

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        default: 'patch'
        type: choice
        options:
          - 'hotfix'
          - 'patch'
          - 'minor'
          - 'major'

jobs:
  create-version:
    name: Create Version
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.MACHINE_USER_APP_ID }}
          private-key: ${{ secrets.MACHINE_USER_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Tag the version
        shell: bash
        env:
          APP_ID: ${{ secrets.MACHINE_USER_APP_ID }}
          VERSION_TYPE: ${{ github.event.inputs.version }}
        run: |
          git config user.name "SF Machine User[bot]"
          git config user.email "${APP_ID}+sf-machine-user[bot]@users.noreply.github.com"
          if [ "$VERSION_TYPE" = "hotfix" ]; then
            npm version patch -m "Hotfix: %s"
          elif [ "$VERSION_TYPE" = "patch" ]; then
            npm version patch -m "Release: %s"
          elif [ "$VERSION_TYPE" = "minor" ]; then
            npm version minor -m "Release: %s"
          else
            npm version major -m "Release: %s"
          fi
          git push --follow-tags
