name: Build Web App and Storybook
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
      environment_name:
        required: true
        type: string
      ref:
        description: 'The branch or tag ref to checkout. Default is the branch that triggered the workflow.'
        default: ''
        required: false
        type: string
    secrets:
      CODECOV_TOKEN:
        required: true
      CHROMATIC_PROJECT_TOKEN:
        required: true
      ALCHEMY_API_KEY:
        required: true
      AMPLITUDE_API_KEY:
        required: true
      SQUID_WIDGET_INTEGRATOR_ID:
        required: true
      WALLET_CONNECT_ID:
        required: true

jobs:
  build-and-test-all:
    name: Build and Test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Use Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: Build Native Dependencies
        run: npm rebuild canvas sharp esbuild @swc/core

      - run: |
          cat <<'EOF' > .env.local
          NEXT_PUBLIC_ALCHEMY_API_KEY=${{ secrets.ALCHEMY_API_KEY }}
          NEXT_PUBLIC_ANKR_API_KEY=${{ secrets.ANKR_API_KEY }}
          NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ secrets.AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_SQUID_WIDGET_INTEGRATOR_ID=${{ secrets.SQUID_WIDGET_INTEGRATOR_ID }}
          NEXT_PUBLIC_WALLET_CONNECT_ID=${{ secrets.WALLET_CONNECT_ID }}
          SF_ENV=${{ vars.SF_ENV }}
          NEXT_PUBLIC_USE_PACKAGE_VERSION=${{ vars.USE_PACKAGE_VERSION }}
          NEXT_PUBLIC_SUPPORTED_CHAIN_IDS=${{ vars.SUPPORTED_CHAIN_IDS }}
          NEXT_PUBLIC_NON_SUBGRAPH_SUPPORTED_CHAIN_IDS=${{ vars.NON_SUBGRAPH_SUPPORTED_CHAIN_IDS }}
          NEXT_PUBLIC_GRAPHQL_SERVER_URL=${{ vars.GRAPHQL_SERVER_URL }}
          NEXT_PUBLIC_SUBGRAPH_URL_314=${{ vars.SUBGRAPH_URL_314 }}
          NEXT_PUBLIC_STABLECOIN_APP_URL=${{ vars.STABLECOIN_APP_URL }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS_TAG=${{ vars.GOOGLE_ANALYTICS_TAG }}
          NEXT_PUBLIC_VAULTS_APP_URL=${{ vars.VAULTS_APP_URL }}
          NEXT_PUBLIC_DELISTED_CURRENCIES_1=${{ vars.DELISTED_CURRENCIES_1 }}
          NEXT_PUBLIC_DELISTED_CURRENCIES_11155111=${{ vars.DELISTED_CURRENCIES_11155111 }}
          NEXT_PUBLIC_DELISTED_CURRENCIES_314=${{ vars.DELISTED_CURRENCIES_314 }}
          NEXT_PUBLIC_DELISTED_CURRENCIES_314159=${{ vars.DELISTED_CURRENCIES_314159 }}
          NEXT_PUBLIC_DELISTED_CURRENCIES_42161=${{ vars.DELISTED_CURRENCIES_42161 }}
          NEXT_PUBLIC_DELISTED_CURRENCIES_421614=${{ vars.DELISTED_CURRENCIES_421614 }}
          NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
          NEXT_PUBLIC_RUNTIME_CONFIG_URL=${{ vars.RUNTIME_CONFIG_URL }}
          EOF

      - name: Check Syntax with Prettier
        run: npm run prettier:check

      - name: Check Style with ESLint
        run: npm run lint:check

      - name: Run Tests
        if: inputs.environment_name == 'development' || inputs.environment_name == 'ci-build'
        run: npm run test:cov

      - name: Upload Code Coverage
        if: inputs.environment_name == 'development' || inputs.environment_name == 'ci-build'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit-tests
          files: './coverage/coverage-final.json'

      - name: Build Web App
        run: npm run build

      - name: Build Storybook
        if: inputs.environment_name == 'development' || inputs.environment_name == 'ci-build'
        uses: chromaui/action@6efa19d4a40404313897de5a6d516e0333a2a787 # v18.14.5
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitOnceUploaded: true
          skip: "main"
          onlyChanged: true

      - name: Publish Web App
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: build
          retention-days: 10
          if-no-files-found: error
