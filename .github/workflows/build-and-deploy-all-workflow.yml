name: Build Web App and Storybook

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  identify-env:
    name: Identify the environment
    uses: ./.github/workflows/identify-env.yml
    with:
      branch_name: ${{ github.ref }}

  build-and-test-all:
    name: Build and Test
    needs: identify-env
    uses: ./.github/workflows/build.yml
    with:
      artifact_name: WebApp
      environment_name: ${{ needs.identify-env.outputs.environment_name }}
    secrets: inherit

  cypress-run:
    name: Cypress Run Tests
    needs: build-and-test-all
    uses: ./.github/workflows/cypress-test.yml
    with:
      artifact_name: WebApp
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    name: Publish to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    needs: [build-and-test-all]
    steps:
      - name: Retrieve artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: WebApp
          path: .deploy/build

      - name: Sanitize branch name
        id: branch
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: echo "name=${BRANCH_NAME//[^a-zA-Z0-9._\/-]/-}" >> "$GITHUB_OUTPUT"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .deploy/build --project-name=secured-finance-app --branch="${{ steps.branch.outputs.name }}"

      - name: Get the output url
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Deploy url is $DEPLOY_URL"

      - name: Comment on PR
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message: |
            🚀 This branch can be previewed at ${{ steps.deploy.outputs.deployment-url }}